name: CI

on:
  push:
    branches: [develop, main, 'feature/**', 'bugfix/**', 'hotfix/**', 'dependabot/**']
  workflow_dispatch:

# Superseded runs are cancelled on working branches; every develop/main run gets its own group, so each commit is built.
concurrency:
  group: ci-${{ github.ref }}${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: ${{ vars.XCODE_DEVELOPER_DIR || '/Applications/Xcode.app/Contents/Developer' }}
  PROJECT: PhilipsLiveApp.xcodeproj
  SCHEME: PhilipsLiveApp
  # Substituted into the generated project by `xcodegen generate`.
  GENESYS_DEPLOYMENT_ID: ${{ secrets.GENESYS_DEPLOYMENT_ID }}
  GENESYS_DOMAIN: ${{ secrets.GENESYS_DOMAIN }}
  GENESYS_DEPLOYMENT_ID_ES: ${{ secrets.GENESYS_DEPLOYMENT_ID_ES }}
  GENESYS_DOMAIN_ES: ${{ secrets.GENESYS_DOMAIN_ES }}
  GENESYS_DEPLOYMENT_ID_PT: ${{ secrets.GENESYS_DEPLOYMENT_ID_PT }}
  GENESYS_DOMAIN_PT: ${{ secrets.GENESYS_DOMAIN_PT }}
  GENESYS_DEPLOYMENT_ID_PR: ${{ secrets.GENESYS_DEPLOYMENT_ID_PR }}
  GENESYS_DOMAIN_PR: ${{ secrets.GENESYS_DOMAIN_PR }}
  GENESYS_DEPLOYMENT_ID_META: ${{ secrets.GENESYS_DEPLOYMENT_ID_META }}
  GENESYS_DOMAIN_META: ${{ secrets.GENESYS_DOMAIN_META }}

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, iOS]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          echo "SwiftLint $(swiftlint version)"
          echo "SwiftFormat $(swiftformat --version)"

      - name: SwiftLint
        run: swiftlint lint --strict --quiet --reporter github-actions-logging

      - name: SwiftFormat
        run: swiftformat --lint .

  build:
    name: Build iOS
    runs-on: [self-hosted, iOS]
    needs: lint
    timeout-minutes: 45
    env:
      TEST_DESTINATION: ${{ vars.IOS_TEST_DESTINATION || 'platform=iOS Simulator,name=iPhone 16' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Xcode project
        uses: ./.github/actions/prepare-project
        with:
          filament-ssh-key: ${{ secrets.FILAMENT_SSH_KEY }}

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$LOGS_DIR/build.log"

      - name: Run tests
        if: hashFiles('PhilipsLiveAppTests/**/*.swift') != ''
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$TEST_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$LOGS_DIR/test.log"

      - name: Upload test results
        if: always() && hashFiles('PhilipsLiveAppTests/**/*.swift') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Xcode logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore
          retention-days: 1

      - name: Stop SSH agent
        if: always() && env.SSH_AGENT_PID != ''
        run: ssh-agent -k

  release:
    name: Archive iOS IPA
    runs-on: [self-hosted, iOS]
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    # Signing secrets live only in this environment, which only develop and main may use.
    environment: release
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Xcode project
        uses: ./.github/actions/prepare-project
        with:
          filament-ssh-key: ${{ secrets.FILAMENT_SSH_KEY }}

      - name: Read signing settings from the project
        run: |
          xcodebuild -showBuildSettings \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            > "$RUNNER_TEMP/build-settings.txt"
          setting() {
            awk -v key="$1" '
              /^Build settings for action / { target = $NF }
              target == "PhilipsLiveApp:" && $1 == key { sub(/^[^=]*= /, ""); print; exit }
            ' "$RUNNER_TEMP/build-settings.txt"
          }
          BUNDLE_ID=$(setting PRODUCT_BUNDLE_IDENTIFIER)
          TEAM_ID=$(setting DEVELOPMENT_TEAM)
          SIGNING_IDENTITY=$(setting CODE_SIGN_IDENTITY)
          PROFILE_UUID=$(setting PROVISIONING_PROFILE_SPECIFIER)
          for value in "$BUNDLE_ID" "$TEAM_ID" "$SIGNING_IDENTITY" "$PROFILE_UUID"; do
            if [ -z "$value" ]; then
              echo "::error::A signing setting of the PhilipsLiveApp target is empty."
              exit 1
            fi
          done
          echo "$BUNDLE_ID, team $TEAM_ID, '$SIGNING_IDENTITY', profile $PROFILE_UUID"
          {
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "TEAM_ID=$TEAM_ID"
            echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "PROFILE_UUID=$PROFILE_UUID"
          } >> "$GITHUB_ENV"

      - name: Install signing certificate and profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE="$RUNNER_TEMP/signing.p12"
          PROFILE="$RUNNER_TEMP/signing.mobileprovision"
          trap 'rm -f "$CERTIFICATE"' EXIT

          base64 --decode <<< "$PROFILE_BASE64" > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          if [ "$(plutil -extract UUID raw -o - "$RUNNER_TEMP/profile.plist")" != "$PROFILE_UUID" ]; then
            echo "::error::IOS_PROVISIONING_PROFILE_BASE64 is not profile $PROFILE_UUID set in project.yml."
            exit 1
          fi
          if [ "$(plutil -extract ProvisionsAllDevices raw -o - "$RUNNER_TEMP/profile.plist")" != "true" ]; then
            echo "::error::Profile $PROFILE_UUID is not an in-house (enterprise) profile."
            exit 1
          fi
          PROFILES_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          INSTALLED_PROFILE="$PROFILES_DIR/$PROFILE_UUID.mobileprovision"
          if [ ! -f "$INSTALLED_PROFILE" ]; then
            mkdir -p "$PROFILES_DIR"
            cp "$PROFILE" "$INSTALLED_PROFILE"
            echo "INSTALLED_PROFILE=$INSTALLED_PROFILE" >> "$GITHUB_ENV"
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security list-keychains -d user > "$RUNNER_TEMP/keychains.before"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          base64 --decode <<< "$CERTIFICATE_BASE64" > "$CERTIFICATE"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" \
            > /dev/null
          xargs security list-keychains -d user -s "$KEYCHAIN" < "$RUNNER_TEMP/keychains.before"

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PhilipsLiveApp.xcarchive" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
            | tee "$LOGS_DIR/archive.log"
          echo "Build number: $GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>enterprise</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingCertificate</key>
            <string>$SIGNING_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PhilipsLiveApp.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-build" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            | tee "$LOGS_DIR/export.log"

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ios-build/*.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Upload xcarchive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcarchive
          path: ${{ runner.temp }}/PhilipsLiveApp.xcarchive
          if-no-files-found: error
          retention-days: 1

      - name: Upload Xcode logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore
          retention-days: 1

      - name: Remove signing certificate and profile
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            xargs security list-keychains -d user -s < "$RUNNER_TEMP/keychains.before"
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${INSTALLED_PROFILE:-}" ]; then
            rm -f "$INSTALLED_PROFILE"
          fi
          

      - name: Stop SSH agent
        if: always() && env.SSH_AGENT_PID != ''
        run: ssh-agent -k
